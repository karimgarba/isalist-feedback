name: 💡 Feature request
description: Suggest an idea or improvement for isalist
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: What would you like isalist to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
